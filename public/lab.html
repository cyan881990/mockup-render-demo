<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup Render Server</title>
<style>
  :root{
    --bg:#0f1115; --panel:#161920; --panel2:#1d2129; --line:#272c36;
    --ink:#e8eaef; --muted:#9aa3b2; --accent:#5b9dff; --good:#3fbf7f; --warn:#f0b354;
    --radius:10px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
  header h1{font-size:15px;margin:0;font-weight:650;letter-spacing:-.01em}
  header .dot{width:8px;height:8px;border-radius:50%;background:var(--good)}
  nav{display:flex;gap:4px;margin-left:auto}
  nav button{background:transparent;border:1px solid transparent;color:var(--muted);padding:6px 12px;border-radius:7px;cursor:pointer;font:inherit}
  nav button:hover{color:var(--ink);background:var(--panel2)}
  nav button.on{color:var(--ink);background:var(--panel2);border-color:var(--line)}
  main{padding:18px;max-width:1500px;margin:0 auto}
  .urlbar{display:flex;gap:8px;margin-bottom:16px}
  .urlbar input{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:11px 14px;color:var(--ink);font:13px ui-monospace,SFMono-Regular,Menlo,monospace}
  .urlbar input:focus{outline:none;border-color:var(--accent)}
  button.primary{background:var(--accent);border:none;color:#06101f;font-weight:650;padding:11px 20px;border-radius:var(--radius);cursor:pointer;font-size:13px}
  button.primary:hover{filter:brightness(1.08)}
  .cols{display:grid;grid-template-columns:320px 1fr;gap:18px;align-items:start}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
  .card h3{margin:0 0 12px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:650}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
  .field input[type=text],.field select{width:100%;background:var(--panel2);border:1px solid var(--line);
    border-radius:8px;padding:8px 10px;color:var(--ink);font:inherit;font-size:13px}
  .field input[type=range]{width:100%;accent-color:var(--accent)}
  .swatches{display:flex;flex-wrap:wrap;gap:6px}
  .sw{width:28px;height:28px;border-radius:7px;border:2px solid transparent;cursor:pointer;position:relative}
  .sw.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--bg) inset}
  .sw.none{background:repeating-linear-gradient(45deg,#333 0 6px,#555 6px 12px)}
  .stage{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;min-height:320px}
  .stage img{width:100%;border-radius:8px;display:block;background:var(--panel2)}
  .meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--muted)}
  .pill{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
  .pill b{color:var(--ink);font-weight:600}
  .pill.hot{color:var(--good);border-color:#1d4634}
  .pill.cold{color:var(--warn);border-color:#4a3a1a}
  .thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
  .thumb{border:1px solid var(--line);border-radius:9px;overflow:hidden;cursor:pointer;background:var(--panel2)}
  .thumb.on{border-color:var(--accent)}
  .thumb img{width:100%;display:block;aspect-ratio:3/2;object-fit:cover}
  .thumb span{display:block;padding:6px 8px;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
  code{font:12px ui-monospace,Menlo,monospace;background:var(--panel2);padding:2px 6px;border-radius:5px;color:#9fc7ff}
  pre{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:12px;overflow:auto;font-size:12px;max-height:380px}
  .hidden{display:none}
  .row{display:flex;gap:8px;align-items:center}
  .row>*{flex:1}
  .warn{color:var(--warn);font-size:12px;margin-top:8px}
  .fontsample{font-size:26px;margin-top:6px;color:var(--ink)}
</style>
</head>
<body>
<header>
  <div class="dot"></div>
  <h1>Mockup Render Server</h1>
  <nav>
    <button data-tab="preview" class="on">Preview</button>
    <button data-tab="mockups">Mockups</button>
    <button data-tab="designs">Designs</button>
    <button data-tab="fonts">Fonts</button>
    <button data-tab="metrics">Metrics</button>
  </nav>
</header>
<main>
  <section id="tab-preview">
    <div class="urlbar">
      <input id="url" spellcheck="false"
        value="https://macorner.co/products/christmas-together-personalized-runner-rug-xma011102vupg?background=red&member=3&soc1=blue&name=Nguyen&soc2=green">
      <button class="primary" id="go">Render</button>
    </div>
    <div class="cols">
      <div>
        <div class="card" id="options"><h3>Options</h3><div id="optbody"></div></div>
        <div class="card" style="margin-top:14px">
          <h3>Output</h3>
          <div class="field"><label>Width <b id="wlabel">800</b> px</label>
            <input type="range" id="w" min="320" max="1600" step="80" value="800"></div>
          <div class="row">
            <div class="field"><label>Format</label>
              <select id="format"><option>webp</option><option>jpeg</option><option>png</option><option>avif</option></select></div>
            <div class="field"><label>Quality</label>
              <select id="quality"><option>70</option><option selected>82</option><option>90</option></select></div>
          </div>
        </div>
      </div>
      <div>
        <div class="stage">
          <img id="out" alt="mockup">
          <div class="meta" id="meta"></div>
          <div class="warn hidden" id="warn"></div>
          <div class="thumbs" id="mockupThumbs"></div>
        </div>
        <div class="card" style="margin-top:14px">
          <h3>Resolved request</h3>
          <pre id="resolved">—</pre>
        </div>
      </div>
    </div>
  </section>

  <section id="tab-mockups" class="hidden"><div class="grid" id="mockupList"></div></section>
  <section id="tab-designs" class="hidden"><div class="grid" id="designList"></div></section>
  <section id="tab-fonts" class="hidden"><div class="card"><h3>Font registry</h3><div id="fontList"></div></div></section>
  <section id="tab-metrics" class="hidden">
    <div class="card"><h3>Live metrics <span style="float:right;font-weight:400;text-transform:none;letter-spacing:0">auto-refresh 2s</span></h3>
      <div id="metricCards" class="grid"></div><pre id="metrics">—</pre></div>
  </section>
</main>
<script src="/app.js"></script>
</body>
</html>
